<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Visualizer</title>
  <meta name="description" content="Classroom cryptography visualizer: Caesar, Vigenère, Playfair, Rail Fence, Hill, AES-128, RSA, Diffie–Hellman, SHA-256 and Base64, step by step.">
  <meta name="theme-color" content="#f7f7f5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M11 14v-3a5 5 0 0 1 10 0v3' stroke='white' stroke-width='2.5' fill='none'/><rect x='8' y='14' width='16' height='11' rx='2.5' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('cv-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (t === 'dark') document.documentElement.classList.add('dark');
      if (localStorage.getItem('cv-large') === '1') document.documentElement.classList.add('large');
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Crypto Visualizer home">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M11 14v-3a5 5 0 0 1 10 0v3" stroke="#fff" stroke-width="2.5" fill="none"/><rect x="8" y="14" width="16" height="11" rx="2.5" fill="#fff"/></svg></span>
      <span>Crypto Visualizer</span>
    </a>
    <div class="top-actions">
      <button id="large-toggle" class="icon-btn" type="button" title="Projector mode (larger text)" aria-label="Projector mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span class="icon-label">Projector</span>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="icon-btn" href="https://github.com/vishal-1307/crypto-visualizer" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 4.6 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
      </a>
    </div>
  </header>
  <main id="main"><noscript><p style="padding:2rem">This app needs JavaScript enabled.</p></noscript></main>
  <footer class="footer">Built for classroom teaching · All computation runs in your browser · <a href="https://github.com/vishal-1307/crypto-visualizer#how-to-add-a-new-method">Add a method</a></footer>
  <script type="module" src="core/app.js"></script>
</body>
</html>
